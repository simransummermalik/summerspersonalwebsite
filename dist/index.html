<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Constellation Portfolio</title>
  
  <script type="module" crossorigin src="./assets/index-ada7a714.js"></script>
  <link rel="stylesheet" href="./assets/index-e91a42f5.css">
</head>
<body>
  <main id="app">
    <div id="scene-root" aria-hidden="true"></div>
    <div id="cluster-labels" aria-hidden="true"></div>
    <div id="quantum-labels" aria-hidden="true"></div>

    <section class="identity-panel" aria-label="Portfolio identity">
      <p class="eyebrow">Constellation Portfolio</p>
      <h1 data-person-name></h1>
      <p class="role" data-person-title></p>
      <p class="tagline" data-person-tagline></p>
    </section>

    <section class="section-panel" aria-live="polite">
      <p class="eyebrow" data-section-kicker></p>
      <h2 data-section-heading></h2>
      <p data-section-text></p>
      <button class="section-action" type="button" data-section-action hidden></button>
    </section>

    <section class="research-archive" data-research-archive aria-hidden="true">
      <button class="research-close" type="button" data-research-close aria-label="Close research signal"></button>
      <p class="research-kicker" data-research-kicker></p>
      <h2 data-research-heading></h2>
      <p class="research-intro" data-research-intro></p>
      <div class="research-list" data-research-list></div>
    </section>
    <section class="space-tour-panel" data-space-tour-panel aria-hidden="true">
      <p data-space-tour-kicker></p>
      <h2 data-space-tour-heading></h2>
      <span data-space-tour-progress></span>
      <p data-space-tour-text></p>
      <button type="button" data-space-tour-exit>Return</button>
    </section>
    <div class="research-node-dock" data-research-node-dock aria-hidden="true"></div>
    <button class="quantum-return" type="button" data-quantum-return aria-hidden="true">Back to research</button>
    <section class="quantum-node-panel" data-quantum-node-panel aria-hidden="true"></section>

    <button class="sun-mode-toggle" type="button" data-sun-mode-toggle aria-label="Light mode" aria-pressed="false">
      Light mode
    </button>
    <button class="sound-toggle" type="button" data-sound-toggle aria-pressed="false">Sound</button>
    <div class="scroll-cue" aria-hidden="true"><span></span></div>
    <div id="youtube-audio-player" aria-hidden="true"></div>
    <nav id="cluster-nav" aria-label="Portfolio sections"></nav>
  </main>
  
</body>
</html>
